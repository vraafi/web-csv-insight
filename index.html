<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Insight</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>CSV Insight</h1>
    <p class="subtitle">Unggah file CSV untuk melihat ringkasan statistik dan grafik batang. Semua diproses di browser.</p>
    <div class="controls">
      <input type="file" id="fileInput" accept=".csv" hidden>
      <button type="button" id="uploadBtn" class="btn-primary">Pilih File CSV</button>
      <button type="button" id="resetBtn" class="btn-secondary">Reset</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="summarySection" hidden>
      <h2>Ringkasan Statistik</h2>
      <div id="summaryTableContainer" class="table-wrapper"></div>
    </section>
    <section id="chartSection" hidden>
      <h2>Grafik Batang</h2>
      <div class="chart-controls">
        <label for="columnSelect">Pilih kolom:</label>
        <select id="columnSelect"></select>
      </div>
      <div class="canvas-wrapper">
        <canvas id="barChart" width="800" height="400"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
