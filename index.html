<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV Insight</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
<h1>CSV Insight</h1>
<p class="subtitle">Unggah berkas CSV untuk melihat ringkasan statistik per kolom dan grafik batang. Semua diproses di browser Anda, tanpa unggah ke server.</p>

<section class="panel" aria-label="Kontrol unggah">
  <div class="controls">
    <label class="file-label">
      <span>Pilih berkas CSV</span>
      <input type="file" id="fileInput" accept=".csv,text/csv" aria-label="Pilih berkas CSV">
    </label>
    <button type="button" id="btnSample" class="btn btn-secondary">Muat Contoh</button>
    <button type="button" id="btnClear" class="btn btn-secondary">Hapus Data</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">Belum ada berkas dimuat.</div>
</section>

<section class="panel" aria-label="Ringkasan statistik">
  <h2>Ringkasan Statistik</h2>
  <div id="summary" class="summary">Belum ada data.</div>
</section>

<section class="panel" aria-label="Grafik batang">
  <h2>Grafik Batang</h2>
  <div class="chart-controls">
    <label for="chartSelect" class="select-label">Kolom untuk grafik:</label>
    <select id="chartSelect" aria-label="Pilih kolom untuk grafik"></select>
  </div>
  <div class="canvas-wrap">
    <canvas id="chart" width="800" height="400" role="img" aria-label="Grafik batang distribusi kolom"></canvas>
  </div>
  <p id="chartInfo" class="chart-info"></p>
</section>
</main>
</body>
</html>
